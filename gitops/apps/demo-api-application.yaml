apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: agentic-devsecops-demo
  source:
    repoURL: https://github.com/farhanashrafdev/AWS-SCD-UETNC-PU.git
    targetRevision: main
    path: gitops/manifests/demo-api
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
